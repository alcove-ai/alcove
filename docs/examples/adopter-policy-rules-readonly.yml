# Read-only GitHub access policy for new adopters
# This is a safe starting configuration that prevents agents from
# making any changes to your repository while they learn.

rule_sets:
  - name: github-readonly
    enforcement_mode: enforce
    rules:
      # Allow reading repository information
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/*"

      # Allow reading file contents
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/contents/**"

      # Allow reading repository metadata
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/branches/**"
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/commits/**"
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/trees/**"

      # Allow reading user information
      - allow:
          method: GET
          host: api.github.com
          path: "/user"

      # Allow reading issues and PRs (but not modifying them)
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/issues/**"
      - allow:
          method: GET
          host: api.github.com
          path: "/repos/*/pulls/**"

      # Block ALL write operations for safety
      - deny:
          method: POST
          host: api.github.com
          path: "/**"
      - deny:
          method: PUT
          host: api.github.com
          path: "/**"
      - deny:
          method: PATCH
          host: api.github.com
          path: "/**"
      - deny:
          method: DELETE
          host: api.github.com
          path: "/**"

  # Optional: Basic cost controls for LLM usage
  - name: basic-cost-control
    enforcement_mode: enforce
    rules:
      # Allow standard Sonnet model
      - allow:
          method: POST
          host: api.anthropic.com
          path: "/v1/messages"
          conditions:
            - json_path: "$.model"
              equals: "claude-sonnet-4-20250514"

      # Block expensive Opus model while learning
      - deny:
          method: POST
          host: api.anthropic.com
          path: "/v1/messages"
          conditions:
            - json_path: "$.model"
              contains: "opus"

      # Reasonable token limit for learning sessions
      - deny:
          method: POST
          host: api.anthropic.com
          path: "/v1/messages"
          conditions:
            - json_path: "$.max_tokens"
              greater_than: 4096