name: Sumo Log Analyzer
description: Analyzes Sumo Logic logs for 5xx errors and drafts Jira issues
executable:
  url: https://github.com/pulp/pulp-service/releases/download/agent-sumo-v1.0/agent-sumo-linux-amd64
  args: ["--model", "claude-opus-4-6"]
timeout: 1800
profiles:
  - sumo-analyzer
direct_outbound: true
credentials:
  SUMO_API_URL: SUMO_API_URL
  SUMO_ACCESS_ID: SUMO_ACCESS_ID
  SUMO_ACCESS_KEY: SUMO_ACCESS_KEY
  JIRA_TOKEN: jira
  VERTEX_SA_JSON: google-vertex
trigger:
  schedule:
    cron: "0 * * * *"
    enabled: true
